name: Build and Test Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
          cache: false
          rustflags: ""
      - uses: extractions/setup-just@v3
      - run: just rust::check

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - uses: extractions/setup-just@v3
      - run: just rust::build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - uses: extractions/setup-just@v3
      - run: just rust::test

  # Keep the status name required by the main branch ruleset.
  build:
    needs: [format, compile, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          for result in ${RESULTS//,/ }; do
            if [[ "$result" != success ]]; then
              echo "Rust checks did not all pass: $RESULTS"
              exit 1
            fi
          done
