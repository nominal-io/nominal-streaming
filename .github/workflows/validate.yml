name: Code validation

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  toml-format:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          rustflags: ""
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: Install TOML formatter
        run: just install-toml
      - name: Check formatting (Taplo)
        run: just check-toml

  rust-format:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: Read formatter pin
        id: formatter
        run: echo "toolchain=$(just --justfile rust.just --evaluate fmt-toolchain)" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ steps.formatter.outputs.toolchain }}
          components: rustfmt
          cache: false
          rustflags: ""
      - name: Check formatting (rustfmt)
        run: just rust::check

  rust-unused-deps:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: Install cargo-machete
        run: just rust::install-machete
      - name: Check unused Rust dependencies
        run: just rust::check-dependencies

  rust-build-test:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          rustflags: ""
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: Build Rust crates
        run: just rust::build
      - name: Run workspace tests
        run: just rust::test

  rust-lint:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: clippy
          rustflags: ""
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: Check lint rules (Clippy)
        run: just rust::lint

  python-format:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: Check formatting (Ruff)
        run: just python::check-format

  python-lint:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"
      - name: Validate uv lockfile
        run: uv lock --check
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: Check lint rules (Ruff)
        run: just python::check-imports

  python-wheel-build:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly
          rustflags: ""
      - name: Build ABI wheel
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uvx --from 'maturin>=1.6,<2.0' maturin build --release --locked --out "$RUNNER_TEMP/wheel-tests" --manifest-path py-nominal-streaming/Cargo.toml -i "$(uv python find 3.11)"
          uv export --locked --only-group test --only-group typing --format requirements-txt --output-file "$RUNNER_TEMP/wheel-tests/requirements.txt"
      - name: Upload wheel and test requirements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-wheel
          path: ${{ runner.temp }}/wheel-tests/
          if-no-files-found: error

  python-wheel-test:
    name: python-wheel-test (${{ matrix.python-version }})
    needs: python-wheel-build
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
      - name: Download wheel and test requirements
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-wheel
          path: ${{ runner.temp }}/wheel-tests/
      - name: Test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/wheel-$PYTHON_VERSION"
          uv venv "$venv" --python "$PYTHON_VERSION"
          uv pip install --python "$venv/bin/python" "$RUNNER_TEMP/wheel-tests"/*.whl
          "$venv/bin/python" -I py-nominal-streaming/tests/check_wheel.py
          uv pip install --python "$venv/bin/python" --requirements "$RUNNER_TEMP/wheel-tests/requirements.txt"
          "$venv/bin/python" -I -m unittest discover -s py-nominal-streaming/tests -v
      - name: Check types (mypy)
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/wheel-$PYTHON_VERSION"
          "$venv/bin/python" -I -m mypy --python-version "$PYTHON_VERSION"
          "$venv/bin/python" -I -m mypy --strict py-nominal-streaming/tests/typing/batch_inputs.py
