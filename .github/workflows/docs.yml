name: Docs

# Pull requests: builds the docs with warnings as errors and links a preview of them. The docs are
# deployed by deploy-docs.yml.

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-build:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: Build docs (Sphinx, warnings fail the build)
        run: just build-docs
      - name: "Built docs: upload and preview"
        if: always()
        uses: nominal-io/nominal-sphinx-theme/.github/actions/docs-preview@243a7cc937780d23876a320ca376c8fdb9f61b55 # main, 2026-11-12
        with:
          path: docs/_build/dirhtml
          job-status: ${{ job.status }}

  # The check main's ruleset requires: a theme bump PR needs a passing docs build, and every other
  # PR passes. See nominal-sphinx-theme's README, "CI".
  docs-gate:
    needs: docs-build
    if: always()
    uses: nominal-io/nominal-sphinx-theme/.github/workflows/docs-gate.yml@243a7cc937780d23876a320ca376c8fdb9f61b55 # main, 2026-11-12
    with:
      docs-result: ${{ needs.docs-build.result }}
