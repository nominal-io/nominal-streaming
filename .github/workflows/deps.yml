name: deps
on: pull_request

jobs:
  approve-deps:
    permissions:
      contents: read
      pull-requests: write
    runs-on: depot-ubuntu-24.04
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'nominal-io/nominal-streaming'
    steps:
      - name: Approve dependency update
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
