[package]
name = "py-nominal-streaming"
description = "Python bindings for the nominal-streaming Rust library"
edition = "2021"
license = "MIT"
version = "0.9.10"
readme = "README.md"
repository = "https://github.com/nominal-io/nominal-streaming"

[lib]
# This becomes the *module* name on the Python side unless overridden by tool.maturin.module-name
name = "_nominal_streaming"
crate-type = ["cdylib"]

[features]
default = ["python310"]
python310 = ["pyo3/abi3-py310"]
python311 = ["pyo3/abi3-py311"]

[build-dependencies]
pyo3-build-config = "0.29"

[dependencies]
# Select the stable ABI floor through the python310 or python311 feature.
pyo3 = { version = "0.29", features = ["extension-module", "time"] }

nominal-api = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
once_cell = "1.21"

# Vendored openssl to enable CI/CD
openssl = { version = "0.10", features = ["vendored"] }

# Logging setup
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Depend on the Rust core crate in the repository root
nominal-streaming = { workspace = true, features = ["logging"] }

anyhow = "1"
crossbeam-channel = "0.5"
tokio-util = "0.7"
